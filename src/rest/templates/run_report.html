<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>data2report • Run Report</title>
    <link href="static/data2report_favicon.png" rel="icon" type="image/png"/>
    <link href="static/style.css" rel="stylesheet" type="text/css"/>
    <script defer src="static/data2report.js" type="text/javascript"></script>
</head>
<body>
<div class="container">
    <div aria-label="Run Report form" class="card" role="region">
        <div class="card-header">
            <div aria-hidden="true" class="logo">data2report</div>
            <div>
                <h1 class="title">LLM-Based Data Reporting System</h1>
                <p class="sub">Upload data and a JSON configuration to generate a report</p>
            </div>
        </div>

        <form action="/report" enctype="multipart/form-data" id="reportForm" method="post" novalidate>
            <div class="grid">
                <div class="field">
                    <div class="field">
                        <div class="toolbar toolbar--wrap">
                            <div class="field field--compact">
                                <label for="savedReports">Saved reports</label>
                                <select id="savedReports"></select>
                                <div class="hint">Choose a saved configuration to load</div>
                            </div>
                            <button class="btn ghost" id="btnLoad" type="button">Load</button>
                            <button type="button" class="btn ghost" id="btnSave" disabled>Save</button>
                            <button class="btn ghost" id="btnFormat" type="button">Format</button>
                            <button class="btn ghost" id="btnExample" type="button">Load example</button>
                        </div>

                        <label for="config">Configuration JSON</label>
                        <textarea aria-describedby="configHint" class="textarea--tall" id="config" name="config"
                                  placeholder='{"id":"report_id", ...}'></textarea>
                        <div class="hint" id="configHint">Press “Format” to pretty-print and validate JSON</div>
                        <div aria-live="polite" class="chips" id="lintChips"></div>
                    </div>
                </div>

                <div class="field">
                    <label for="file">Data file</label>
                    <div aria-label="Drop or choose a CSV or JSONL file" class="dropzone" id="dropzone" role="button"
                         tabindex="0">
                        <div>
                            <div class="dz-title">Drag & drop</div>
                            <div class="hint">CSV, JSONL, or compressed (.gz)</div>
                        </div>
                    </div>
                    <input accept=".csv,.jsonl,.gz,text/csv,application/gzip" class="hidden" id="file" name="file"
                           type="file"/>

                    <div class="row">
                        <div class="field">
                            <label for="maxRecords">Max records (optional)</label>
                            <input id="maxRecords" min="1" name="max_records" placeholder="no limit" step="1"
                                   type="number"/>

                            <div class="field field--inline field--mt-12">
                                <input class="mr-8" id="force" name="force" type="checkbox" value="true"/>
                                <label class="mb-0" for="force">Force (clear work folder before run)</label>
                            </div>
                        </div>
                    </div>

                    <div class="row row--mt-18">
                        <button class="btn" type="submit" disabled>Run report</button>
                        <button class="btn ghost" id="btnStop" type="button">Stop</button>
                        <button class="btn ghost" id="btnClear" type="button">Clear</button>
                    </div>
                </div>
            </div>

            <div class="footer">
                <div aria-hidden="true" class="progress">
                    <div class="bar" id="bar"></div>
                </div>
                <div class="status" id="status">Idle</div>
            </div>

            <div class="result" hidden id="result">
                <div class="row row--mb-8">
                    <strong>Response</strong>
                    <div class="row row--gap-8 row--justify-end">
                        <button class="btn ghost" id="btnCopy" type="button">Copy</button>
                        <button class="btn ghost" id="btnDownload" type="button">Download</button>
                    </div>
                </div>
                <pre id="resultPre"></pre>
            </div>

            <div class="progress-pane" id="progressPane"></div>
        </form>
    </div>
</div>
</body>
</html>
