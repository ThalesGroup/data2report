<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>data2report • Run Report</title>
    <link rel="icon" type="image/png" href="static/data2report_favicon.png" />
    <link type="text/css" rel="stylesheet" href="static/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card" role="region" aria-label="Run Report form">
        <div class="card-header">
          <div class="logo" aria-hidden="true">D2</div>
          <div>
            <h1 class="title">Run Report</h1>
            <p class="sub">Upload data and a JSON configuration to generate a report</p>
          </div>
        </div>

        <form id="reportForm" action="/report" method="post" enctype="multipart/form-data" novalidate>
          <div class="grid">
            <div class="row" style="margin-bottom:10px; gap:8px; align-items:end">
  <div class="field" style="flex: 1 1 50%">
    <label for="savedReports">Saved reports</label>
    <select id="savedReports"></select>
    <div class="hint">Choose a saved configuration to load</div>
  </div>
  <button type="button" class="btn ghost" id="btnLoad">Load</button>
  <button type="button" class="btn ghost" id="btnSave">Save</button>
</div>
            <div class="field">
              <label for="config">Configuration JSON</label>
              <div class="toolbar">
                <button type="button" class="btn ghost" id="btnFormat">Format</button>
                <button type="button" class="btn ghost" id="btnExample">Load example</button>
              </div>
              <textarea id="config" name="config" placeholder='{"id":"report_id", ...}' aria-describedby="configHint" style="min-height:400px;"></textarea>
              <div id="configHint" class="hint">Press “Format” to pretty-print and validate JSON</div>
              <div class="chips" id="lintChips" aria-live="polite"></div>
            </div>

            <div class="field">
              <label for="file">Data file</label>
              <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Drop or choose a CSV or JSONL file">
                <div>
                  <div style="font-weight:700;color:#d7e3ff">Drag & drop</div>
                  <div class="hint">CSV, JSONL, or compressed (.gz)</div>
                </div>
              </div>
              <input type="file" id="file" name="file" accept=".csv,.jsonl,.gz,text/csv,application/gzip" style="display:none" />
              <div class="row">
                <div class="field">
                  <label for="maxRecords">Max records (optional)</label>
                  <input type="number" id="maxRecords" name="max_records" min="1" step="1" placeholder="no limit" />
                  <div class="field" style="margin-top:12px; display:flex; flex-direction:row; align-items:center;">
                    <input type="checkbox" id="force" name="force" value="true" style="margin-right:8px;" />
                    <label for="force" style="margin-bottom:0;">Force (clear work folder before run)</label>
                  </div>
                </div>
              </div>
              <div class="row" style="margin-top:18px;">
                <button type="submit" class="btn">Run report</button>
                <button type="button" class="btn ghost" id="btnStop">Stop</button>
                <button type="button" class="btn ghost" id="btnClear">Clear</button>
              </div>
            </div>
          </div>

          <div class="footer">
            <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div>
            <div class="status" id="status">Idle</div>
          </div>

          <div class="result" id="result" hidden>
            <div class="row" style="margin-bottom:8px">
              <strong>Response</strong>
              <div style="display:flex; gap:8px; justify-content:flex-end">
                <button type="button" class="btn ghost" id="btnCopy">Copy</button>
                <button type="button" class="btn ghost" id="btnDownload">Download</button>
              </div>
            </div>
            <pre id="resultPre"></pre>
          </div>

          <div id="progressPane" style="margin:16px 0; background:#101a2a; color:#a7ffef; padding:8px; border-radius:6px; font-size:14px"></div>
        </form>
      </div>
    </div>

    <script>
      const form = document.getElementById('reportForm');
      const configEl = document.getElementById('config');
      const lintChips = document.getElementById('lintChips');
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('file');
      const bar = document.getElementById('bar');
      const statusEl = document.getElementById('status');
      const resultBox = document.getElementById('result');
      const resultPre = document.getElementById('resultPre');

      const btnFormat = document.getElementById('btnFormat');
      const btnExample = document.getElementById('btnExample');
      const btnClear = document.getElementById('btnClear');
      const btnCopy = document.getElementById('btnCopy');
      const btnDownload = document.getElementById('btnDownload');
      const savedSel = document.getElementById('savedReports');
      const btnLoad  = document.getElementById('btnLoad');
      const btnSave  = document.getElementById('btnSave');
      const runBtn = document.querySelector('button.btn[type="submit"]');
      const btnStop = document.getElementById('btnStop');

      let currentRun = { reportId: null, runId: null };

      function setStatus(msg) {
        statusEl.textContent = msg;
      }
      function setProgress(pct) {
        bar.style.width = pct + '%';
      }
      function chip(text, tone='ok') {
        const div = document.createElement('div');
        div.className = 'chip';
        div.style.borderColor = tone === 'err' ? '#4a1f26' : tone === 'warn' ? '#4a3b1f' : '#214a40';
        div.style.background = tone === 'err' ? '#2a0f14' : tone === 'warn' ? '#2a1f0f' : '#0f1f2a';
        div.style.color = tone === 'err' ? '#ffb4c0' : tone === 'warn' ? '#ffd49a' : '#a7ffef';
        div.textContent = text;
        return div;
      }
      function lintJSON(str) {
        lintChips.innerHTML = '';
        if (!str.trim()) return;
        try {
          const parsed = JSON.parse(str);
          lintChips.appendChild(chip('Valid JSON', 'ok'));
          // Lightweight schema hints (non-blocking)
          if (!parsed.id) lintChips.appendChild(chip('Missing id', 'warn'));
          if (!parsed.llm) lintChips.appendChild(chip('Missing llm section', 'warn'));
          if (parsed.report && parsed.report.incremental === true && parsed.report.max_workers !== 1) {
            lintChips.appendChild(chip('incremental=true requires max_workers=1', 'warn'));
          }
          return true;
        } catch (e) {
          lintChips.appendChild(chip('Invalid JSON: ' + e.message, 'err'));
          return false;
        }
      }

      configEl.addEventListener('input', () => lintJSON(configEl.value));
      btnFormat.addEventListener('click', () => {
        try {
          const obj = JSON.parse(configEl.value);
          configEl.value = JSON.stringify(obj, null, 2);
          lintJSON(configEl.value);
        } catch (e) {
          alert('Configuration must be valid JSON.');
        }
      });
      btnExample.addEventListener('click', () => {
        const example = {
          id: "test_report",
          name: "Test Report",
          llm: {
            model_id: "anthropic.claude-3-5-sonnet-20240620-v1:0",
            system_prompt: "Analyze my data...",
            temperature: 0.3,
            max_tokens: 1000
          },
          report: { chunk_size: 100, incremental: true, max_workers: 1 }
        };
        configEl.value = JSON.stringify(example, null, 2);
        lintJSON(configEl.value);
      });
      btnClear.addEventListener('click', () => {
        configEl.value = '';
        fileInput.value = '';
        lintChips.innerHTML = '';
        setProgress(0); setStatus('Idle');
        resultBox.hidden = true; resultPre.textContent = '';
      });


      btnStop.addEventListener('click', async () => {
  if (!currentRun.reportId || !currentRun.runId) {
    return alert('No running job to stop.');
  }
  try {
    await fetch('/stop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ report_id: currentRun.reportId, run_id: currentRun.runId }),
    });
    setStatus('Stop requested');
    if (es) es.close();   // stop receiving SSE
  } catch (e) {
    alert('Failed to request stop: ' + (e?.message || e));
  }
});

      // Drag & drop
      const openPicker = () => fileInput.click();
      dropzone.addEventListener('click', openPicker);
      dropzone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPicker(); }});
      dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
      dropzone.addEventListener('drop', e => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          setStatus('File attached: ' + e.dataTransfer.files[0].name);
        }
      });
      fileInput.addEventListener('change', () => {
        if (fileInput.files.length) setStatus('File attached: ' + fileInput.files[0].name);
      });

      let es;
      function makeRunId() {
        const d = new Date();
        return d.toISOString().slice(0,10) + '-' + Math.random().toString(36).slice(2,8);
      }
      function subscribeProgress(reportId, runId) {
        if (es) { es.close(); }
        es = new EventSource(`/progress/stream?report_id=${encodeURIComponent(reportId)}&run_id=${encodeURIComponent(runId)}`);
        let totalIn = 0, totalOut = 0;
        es.addEventListener('progress', (e) => {
          const evt = JSON.parse(e.data);
          totalIn += evt.usage?.input_tokens ?? 0;
          totalOut += evt.usage?.output_tokens ?? 0;
          const total = evt.total_chunks || 1;
          const done = evt.completed_chunks || evt.chunk_index || 1;
          const pct = Math.max(5, Math.min(99, Math.floor((done / total) * 100)));
          setProgress(pct);
          document.getElementById('progressPane').innerHTML =
            `Chunk ${done}/${total} done<br>` +
            `Tokens in: ${totalIn} &nbsp; Tokens out: ${totalOut}<br>` +
            `Last chunk duration: ${evt.duration_seconds ?? 0}s`;
        });
        es.onerror = () => {};
      }

      // Submit with progress + client-side JSON validation + optional numeric params
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const ok = await validateViaApi(true);
        if (!ok) { alert('Fix configuration errors first'); return; }
        const cfg = JSON.parse(configEl.value);
        if (!cfg.id) { alert("Configuration must include 'id'"); return; }
        cfg.run_id = cfg.run_id || makeRunId();
        configEl.value = JSON.stringify(cfg, null, 2);
        currentRun = { reportId: cfg.id, runId: cfg.run_id };

        const fd = new FormData(form);
        fd.set('config', configEl.value);

        subscribeProgress(cfg.id, cfg.run_id);
        setStatus('Uploading...'); setProgress(5);

        try {
          const res = await fetch(form.action, {
            method: 'POST',
            body: fd,
          });

          setProgress(100); setStatus(res.ok ? 'Completed' : 'Failed');
          resultBox.hidden = false;
          try {
    const payload = await res.json();
    resultPre.textContent = JSON.stringify(payload, null, 2);
    if (payload.report_id && payload.run_id) {
      const a = document.createElement('a');
      a.href = `/report?id=${encodeURIComponent(payload.report_id)}&run_id=${encodeURIComponent(payload.run_id)}`;
      a.textContent = 'Open final report';
      a.target = '_blank';
      resultPre.parentElement.appendChild(a);
    }
  } catch {
    resultPre.textContent = await res.text(); // fallback for non-JSON
  }
        } catch (e) {
          setStatus('Network error');
          alert('Failed to submit: ' + (e?.message || e));
        } finally {
          setTimeout(() => setProgress(0), 800);
          setTimeout(() => { if (es) es.close(); }, 30000);
        }
      });

      // Copy / Download
      btnCopy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(resultPre.textContent || '');
          setStatus('Copied to clipboard');
        } catch { setStatus('Clipboard not available'); }
      });
      btnDownload.addEventListener('click', () => {
        const blob = new Blob([resultPre.textContent || ''], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'report.txt';
        a.click();
        URL.revokeObjectURL(a.href);
      });
async function refreshSavedReports() {
  try {
    const res = await fetch('/reports');
    const ids = await res.json(); // ["test_report", ...]
    savedSel.innerHTML = '';
    const ph = document.createElement('option');
    ph.value = ''; ph.textContent = '— Select report —';
    savedSel.appendChild(ph);
    ids.forEach(id => {
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = id;
      savedSel.appendChild(opt);
    });
  } catch (e) {
    console.warn('Failed to load reports list', e);
  }
}

btnLoad.addEventListener('click', async () => {
  const id = savedSel.value;
  if (!id) return alert('Pick a report to load');
  try {
    const res = await fetch(`/report-config?id=${encodeURIComponent(id)}`);
    if (!res.ok) throw new Error(await res.text());
    const cfg = await res.json();
    configEl.value = JSON.stringify(cfg, null, 2);
    await validateViaApi(); // reflect chips and enable/disable run
  } catch (e) {
    alert('Failed to load configuration: ' + e.message);
  }
});

btnSave.addEventListener('click', async () => {
  const ok = await validateViaApi(true); // strict
  if (!ok) return;

  try {
    const cfg = JSON.parse(configEl.value);
    const res = await fetch('/save-report-config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cfg),
    });
    const payload = await res.json();
    if (!res.ok) throw new Error((payload && payload.errors) ? payload.errors.join('; ') : JSON.stringify(payload));
    setStatus(`Saved: ${payload.id}`);
    await refreshSavedReports();
    savedSel.value = cfg.id;
  } catch (e) {
    alert('Failed to save configuration: ' + e.message);
  }
});

async function validateViaApi(strict=false) {
  let cfg;
  try { cfg = JSON.parse(configEl.value); }
  catch (e) { showChips(['Invalid JSON: ' + e.message], 'err'); if (strict) return false; else return true; }

  const res = await fetch('/validate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(cfg),
  });
  const errors = await res.json(); // array of strings
  lintChips.innerHTML = '';
  if (errors.length) {
    errors.forEach(e => lintChips.appendChild(chip(e, 'err')));
    runBtn.disabled = true;
    return false;
  } else {
    lintChips.appendChild(chip('Valid configuration', 'ok'));
    runBtn.disabled = false;
    return true;
  }
}

function showChips(msgs, tone) {
  lintChips.innerHTML = '';
  msgs.forEach(m => lintChips.appendChild(chip(m, tone)));
}

// live validate with debounce
let vTimer;
configEl.addEventListener('input', () => {
  clearTimeout(vTimer);
  vTimer = setTimeout(() => validateViaApi().catch(()=>{}), 250);
});

document.addEventListener('DOMContentLoaded', () => {
    refreshSavedReports();
    validateViaApi().catch(()=>{});
  });
    </script>
  </body>
</html>
